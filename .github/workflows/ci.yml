name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned, deliberately; see docs/map/territory/ci-gates.md.
  FLUTTER_VERSION: 3.41.9
  # The floor lives here and nowhere else; see docs/map/territory/ci-gates.md.
  COVERAGE_FLOOR: 100

jobs:
  verify:
    name: analyze, test, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Report toolchain
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      # Must follow `pub get`; see docs/map/territory/ci-gates.md.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test with coverage
        run: flutter test --coverage

      - name: Enforce the coverage floor
        run: dart run tool/check_coverage.dart --min ${{ env.COVERAGE_FLOOR }} --report

      # `always()` and `warn` are deliberate; see docs/map/territory/ci-gates.md.
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: coverage/lcov.info
          if-no-files-found: warn
